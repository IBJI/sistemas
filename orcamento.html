<!DOCTYPE html> <!-- HTML5 moderno -->
<html lang="pt-br"> <!-- Idioma português -->
<head> <!-- Configurações invisíveis -->
<meta charset="utf-8"> <!-- Libera acentos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsivo celular -->
<title>ORÇAMENTO - SANTOS SISTEMAS</title> <!-- Título aba -->
<style> /* Inicia CSS */
*{box-sizing:border-box;} /* Padding não aumenta largura */
body{ /* Corpo todo */
margin:0; /* Tira margem branca */
font-family:Arial, sans-serif; /* Fonte Arial */
background:#0a1931; /* Azul escuro */
color:#fff; /* Letra branca */
overflow-x:hidden; /* Sem scroll lateral */
} /* Fecha body */

/* === TOPO === */
.topo{ /* Barra topo */
min-height:68px; /* Altura mínima 68px */
padding:10px 30px; /* Espaço interno */
display:flex; /* Lado a lado */
align-items:center; /* Meio vertical */
justify-content:center; /* Centro */
position:fixed; /* Fixa no topo */
top:0;left:0; /* Topo 0 esquerda 0 */
width:100%; /* 100% largura */
z-index:20; /* Camada 20 */
background:rgba(10,25,49,0.96); /* Azul quase sólido */
backdrop-filter:blur(6px); /* Desfoque */
} /* Fecha topo */
.logo-meio{ /* Div logo + nome */
position:absolute; /* Posição solta */
left:50%; /* Meio tela */
transform:translateX(-50%); /* Centraliza certinho */
top:8px; /* Desce 8px sobrepondo */
z-index:30; /* Frente tudo */
display:flex; /* Coluna */
flex-direction:column; /* Um em cima do outro */
align-items:center; /* Centraliza */
gap:8px; /* Espaço 8px */
text-decoration:none; /* Sem sublinhado */
} /* Fecha logo-meio */
.logo-meio img{ /* Imagem logo */
height:clamp(72px,8vw,108px); /* Responsivo 72 a 108px */
width:clamp(72px,8vw,108px); /* Responsivo */
border-radius:50%; /* Círculo */
background:#d9d9d9; /* Cinza claro */
padding:4px; /* Espaço interno */
object-fit:contain; /* Não estica */
box-shadow:0 0 0 5px #fff,0 0 0 7px #e0e0e0,0 8px 20px rgba(0,0,0,0.6); /* Bordas + sombra 3D */
border:2px solid #fff; /* Borda branca */
} /* Fecha img */
.nome-logo{ /* Nome SANTOS SISTEMAS */
font-size:clamp(11px,1.5vw,18px); /* Responsivo */
font-weight:900; /* Negrito extra */
letter-spacing:2.5px; /* Espaço letras */
text-shadow:0 2px 6px rgba(0,0,0,0.9); /* Sombra */
white-space:nowrap; /* Uma linha só */
color:#fff; /* Branco */
} /* Fecha nome */
.btn-voltar{ /* Botão VOLTAR esquerda */
position:absolute; /* Posição fixa */
top:14px; /* 14px topo */
left:20px; /* 20px esquerda */
padding:8px 18px; /* Espaço interno */
background:#0033cc; /* Azul */
color:#fff; /* Branco */
text-decoration:none; /* Sem sublinhado */
border-radius:20px; /* Redondo */
font-weight:bold; /* Negrito */
font-size:clamp(11px,1vw,13px); /* Responsivo */
z-index:25; /* Frente */
transition:all .3s; /* Animação */
} /* Fecha voltar */
.btn-voltar:hover{ /* Hover voltar */
transform:scale(1.12) translateY(-3px); /* Aumenta sobe */
background:#0022aa; /* Azul escuro */
box-shadow:0 8px 20px rgba(0,51,204,0.5); /* Sombra azul */
} /* Fecha hover */

/* === CONTEÚDO === */
.conteudo{ /* Caixa central */
padding:160px 20px 60px; /* 160 cima 20 lados 60 baixo */
max-width:700px; /* Largura 700px formulário */
margin:0 auto; /* Centraliza */
width:100%; /* 100% celular */
} /* Fecha conteudo */
.conteudo h1{ /* Título */
text-align:center; /* Centro */
font-size:clamp(22px,4vw,30px); /* Responsivo */
color:#ff1a1a; /* Vermelho */
letter-spacing:2px; /* Espaço letras */
margin-bottom:10px; /* Espaço baixo */
line-height:1.2; /* Altura linha */
} /* Fecha h1 */
.sub{ /* Subtítulo */
text-align:center; /* Centro */
color:#cbd5e1; /* Cinza claro */
font-size:clamp(12px,1.5vw,14px); /* Responsivo */
margin-bottom:25px; /* Espaço baixo */
} /* Fecha sub */

.form-box{ /* Caixa formulário */
background:rgba(255,255,255,0.05); /* Fundo 5% */
border:1.5px solid #3d5bff; /* Borda azul */
border-radius:16px; /* Arredondado */
padding:25px; /* Espaço interno */
box-shadow:0 10px 30px rgba(0,0,0,0.4); /* Sombra */
width:100%; /* 100% responsivo */
} /* Fecha form-box */

label{ /* Rótulo campo */
display:block; /* Linha própria */
text-align:left; /* Esquerda */
font-size:clamp(12px,1.5vw,13px); /* Responsivo */
font-weight:bold; /* Negrito */
color:#cbd5e1; /* Cinza claro */
margin:14px 0 6px 4px; /* Espaço */
} /* Fecha label */

input[type="text"],input[type="tel"],input[type="email"],input[type="url"],textarea{ /* Campos texto */
width:100%; /* 100% largura caixa */
padding:12px 14px; /* Espaço interno */
border-radius:8px; /* Arredondado */
border:1.5px solid #3d5bff; /* Borda azul */
background:rgba(255,255,255,0.08); /* Fundo 8% */
color:#fff; /* Letra branca */
font-size:14px; /* 14px */
outline:none; /* Tira borda azul */
transition:all .3s; /* Animação */
text-transform:uppercase; /* Mostra maiúsculo visual */
} /* Fecha inputs */
input:focus,textarea:focus{ /* Quando clica */
border-color:#ff1a1a; /* Borda vermelha */
box-shadow:0 0 0 3px rgba(255,26,26,0.2); /* Brilho vermelho */
transform:scale(1.01); /* Aumenta 1% */
} /* Fecha focus */

.servicos-grid{ /* Grid checkboxes */
display:grid; /* Grade */
grid-template-columns:1fr 1fr; /* 2 colunas */
gap:10px; /* Espaço 10px */
margin:10px 0; /* Espaço */
} /* Fecha grid */
.check-item{ /* Item checkbox */
display:flex; /* Lado a lado */
align-items:center; /* Meio vertical */
gap:8px; /* Espaço 8px */
background:rgba(255,255,255,0.06); /* Fundo 6% */
border:1px solid #3d5bff; /* Borda azul */
border-radius:8px; /* Arredondado */
padding:10px 12px; /* Espaço interno */
font-size:clamp(11px,1.4vw,13px); /* Responsivo */
cursor:pointer; /* Mãozinha */
transition:all .3s; /* Animação */
} /* Fecha check-item */
.check-item:hover{ /* Hover serviço */
transform:scale(1.03) translateY(-2px); /* Aumenta sobe */
background:rgba(61,91,255,0.15); /* Azul claro */
} /* Fecha hover */
.check-item input{ /* Checkbox dentro */
width:16px; /* 16px */
height:16px; /* 16px */
accent-color:#ff1a1a; /* Vermelho marcado */
flex-shrink:0; /* Não esmaga */
} /* Fecha input checkbox */

.btn-enviar{ /* Botão enviar */
width:100%; /* 100% largura */
margin-top:22px; /* Espaço cima */
padding:14px; /* Altura */
background:#ff1f2a; /* Vermelho */
color:#fff; /* Branco */
border:none; /* Sem borda */
border-radius:10px; /* Arredondado */
font-size:clamp(14px,2vw,16px); /* Responsivo */
font-weight:900; /* Negrito extra */
cursor:pointer; /* Mãozinha */
transition:all .3s; /* Animação */
} /* Fecha btn-enviar */
.btn-enviar:hover{ /* Hover enviar */
transform:scale(1.03) translateY(-3px); /* Aumenta sobe */
box-shadow:0 12px 30px rgba(255,31,42,0.5); /* Sombra vermelha */
background:#e60000; /* Vermelho escuro */
} /* Fecha hover */
.obrig{ /* Asterisco obrigatório */
color:#ff1a1a; /* Vermelho */
} /* Fecha obrig */

/* === RESPONSIVO === */
@media(max-width:900px){ /* Tablet e celular até 900px */
.topo{ /* Topo celular */
min-height:auto; /* Altura auto */
flex-direction:column; /* Coluna */
padding:12px 15px 15px; /* Padding menor */
gap:10px; /* Espaço 10px */
position:relative; /* Relativo não fixo */
justify-content:center; /* Centro */
} /* Fecha topo media */
.logo-meio{ /* Logo celular */
position:relative; /* Relativo não absoluto */
left:auto; /* Tira 50% */
transform:none; /* Tira centraliza */
top:auto; /* Tira 8px */
order:-1; /* Vai pra cima */
} /* Fecha logo-meio media */
.btn-voltar{ /* Voltar celular */
position:relative; /* Relativo */
top:auto; /* Tira topo */
left:auto; /* Tira esquerda */
order:1; /* Vai pra baixo */
margin-top:5px; /* Espaço cima */
} /* Fecha voltar media */
.conteudo{ /* Conteúdo celular */
padding:30px 15px 40px; /* 30 cima 15 lados 40 baixo */
} /* Fecha conteudo media */
.form-box{ /* Form celular */
padding:20px 15px; /* Menos padding */
} /* Fecha form-box media */
.servicos-grid{ /* Grid celular */
grid-template-columns:1fr; /* 1 coluna no celular */
gap:8px; /* Espaço 8px */
} /* Fecha grid media */
} /* Fecha media 900px */
</style> <!-- Fecha CSS -->
</head> <!-- Fecha head -->
<body> <!-- Corpo visível -->
<header class="topo"> <!-- Topo padrão -->
<a href="index.html" class="btn-voltar">⬅ VOLTAR</a> <!-- Botão voltar index -->
<a href="index.html" class="logo-meio"> <!-- Logo link index -->
<img src="logo.png" alt="SANTOS SISTEMAS"> <!-- Imagem logo -->
<span class="nome-logo">SANTOS SISTEMAS</span> <!-- Nome -->
</a> <!-- Fecha logo-meio -->
</header> <!-- Fecha header -->
<main class="conteudo"> <!-- Conteúdo principal -->
<h1>SOLICITAR ORÇAMENTO</h1> <!-- Título página -->
<p class="sub">Preencha seus dados e selecione os serviços desejados.</p> <!-- Subtítulo -->
<div class="form-box"> <!-- Caixa formulário -->
<form id="formOrcamento" onsubmit="enviarWhatsapp(event)"> <!-- Form chama função JS -->
<label>Nome completo <span class="obrig">*</span></label> <!-- Rótulo nome -->
<input type="text" id="nome" placeholder="EX: JOAO SILVA" maxlength="30" required autocomplete="off"> <!-- Id nome placeholder maiúsculo maxlength 30 required autocomplete off -->
<label>Telefone / WhatsApp <span class="obrig">*</span></label> <!-- Rótulo telefone -->
<input type="tel" id="telefone" placeholder="(63)9813-0174" maxlength="14" required inputmode="numeric" autocomplete="off"> <!-- Id telefone placeholder formato maxlength 14 required inputmode numeric -->
<label>Email <span class="obrig">*</span></label> <!-- Rótulo email -->
<input type="email" id="email" placeholder="joao@empresa.com" required style="text-transform:none"> <!-- Email obrigatório style none não maiúsculo -->
<label>Site da empresa</label> <!-- Rótulo site opcional -->
<input type="url" id="site" placeholder="https://suaempresa.com.br" style="text-transform:none"> <!-- Site opcional none -->
<label>Endereço / Cidade <span class="obrig">*</span></label> <!-- Rótulo endereço -->
<input type="text" id="endereco" placeholder="Rua X, 123 - Araguaína-TO" required> <!-- Endereço obrigatório -->
<label>Quais serviços deseja? <span class="obrig">*</span></label> <!-- Rótulo serviços -->
<div class="servicos-grid"> <!-- Grid 2 colunas -->
<label class="check-item"><input type="checkbox" value="COM VIA RÁDIO"> COM VIA RÁDIO</label> <!-- Checkbox serviço -->
<label class="check-item"><input type="checkbox" value="COMISSIONAMENTO"> COMISSIONAMENTO</label> <!-- Checkbox -->
<label class="check-item"><input type="checkbox" value="CONTROLE CLP"> CONTROLE CLP</label> <!-- Checkbox -->
<label class="check-item"><input type="checkbox" value="OIT"> OIT</label> <!-- Checkbox -->
<label class="check-item"><input type="checkbox" value="PYTHON E SCADA"> PYTHON E SCADA</label> <!-- Checkbox -->
<label class="check-item"><input type="checkbox" value="SCADA"> SCADA</label> <!-- Checkbox -->
</div> <!-- Fecha grid -->
<label>Descreva sua necessidade</label> <!-- Rótulo descrição -->
<textarea id="mensagem" rows="4" placeholder="Ex: Preciso de automação para..."></textarea> <!-- Área texto livre -->
<button type="submit" class="btn-enviar">📲 ENVIAR ORÇAMENTO VIA WHATSAPP</button> <!-- Botão enviar -->
</form> <!-- Fecha form -->
</div> <!-- Fecha form-box -->
</main> <!-- Fecha main -->
<script> // Inicia JS
document.getElementById('nome').addEventListener('input', function(e){ // Pega nome escuta input digita
let v = e.target.value.toUpperCase(); // Converte maiúsculo toUpperCase
v = v.replace(/[^A-ZÁÀÂÃÉÊÍÓÔÕÚÇ\s]/g, ''); // Remove não letra regex
v = v.slice(0,30); // Limita 30 chars slice
e.target.value = v; // Aplica valor tratado
}); // Fecha listener nome
document.getElementById('telefone').addEventListener('input',function(e){ // Pega telefone escuta input
let v=e.target.value.replace(/\D/g,''); // Remove não número \D só dígitos
v=v.slice(0,11); // Limita 11 dígitos
let f=''; // Variável formatada vazia
if(v.length>0){ f='(' + v.substring(0,2); } // Abre ( + DDD
if(v.length>=3){ f+=')' + v.substring(2,6); } // Fecha ) + meio
if(v.length>=7){ f+='-' + v.substring(6,11); } // Adiciona - + resto
if(v.length==11){ f='(' + v.substring(0,2) + ')' + v.substring(2,7) + '-' + v.substring(7,11); } // Celular novo 9 na frente
e.target.value=f; // Aplica formatado máscara automática
}); // Fecha máscara telefone
function enviarWhatsapp(e){ // Função enviar
e.preventDefault(); // Impede recarregar página
let nome=document.getElementById('nome').value; // Pega nome já maiúsculo
let tel=document.getElementById('telefone').value; // Pega telefone formatado
let email=document.getElementById('email').value; // Pega email
let site=document.getElementById('site').value||'Não informado'; // Pega site ou padrão
let end=document.getElementById('endereco').value; // Pega endereço
let msg=document.getElementById('mensagem').value||'Não informado'; // Pega mensagem ou padrão
let servicos=[]; // Array vazio serviços
document.querySelectorAll('.servicos-grid input:checked').forEach(c=>{ // Para cada checkbox marcado
servicos.push(c.value); // Adiciona valor array push
}); // Fecha forEach
if(servicos.length===0){ alert('Selecione pelo menos 1 serviço!'); return; } // Se nenhum marcado alerta
if(nome.length<3){ alert('Digite nome válido com 3+ letras!'); return; } // Valida nome mínimo 3
if(tel.length<13){ alert('Digite telefone completo (xx)xxxx-xxxx'); return; } // Valida telefone mínimo 13
let texto=`*NOVO ORÇAMENTO - SANTOS SISTEMAS*%0A%0A*Nome:* ${nome}%0A*Telefone:* ${tel}%0A*Email:* ${email}%0A*Site:* ${site}%0A*Endereço:* ${end}%0A%0A*Serviços:*%0A- ${servicos.join('%0A- ')}%0A%0A*Detalhes:* ${msg}%0A`; // Monta texto WhatsApp %0A quebra linha
let numero='5563981301747'; // Seu número WhatsApp 55 Brasil + 63
let link=`https://wa.me/${numero}?text=${texto}`; // Monta link wa.me
window.open(link,'_blank'); // Abre WhatsApp nova aba
} // Fecha função
</script> <!-- Fecha script -->
</body> <!-- Fecha body -->
</html>
